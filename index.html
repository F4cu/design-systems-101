<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Design Systems 101</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A field guide to running design systems — token architecture, governance, adoption, and AI-readiness.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --base-font-size: 16px; --theme-color: #0006bd; }
    body { -webkit-text-size-adjust: 100%; }

    body, .markdown-section, .sidebar {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .markdown-section {
      font-size: 16px;
      line-height: 1.7;
      color: #1f2328;
    }
    .markdown-section code,
    .markdown-section pre {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    /* Sidebar section labels (bold, link-less list items) default to 15px/700 while
       the page links under them sit at 14px — same left edge, different size. Match
       the label size/weight down to the links so the list reads as one level. */
    .sidebar-nav {
      font-size: 14px;
    }
    .sidebar-nav > ul > li > strong {
      font-size: 14px;
      font-weight: 600;
      margin-left: 16px;
    }

    /* WCAG 1.4.8: cap line length at ~75 characters and give paragraphs breathing
       room (>= 1.5x line spacing) — measure applies only to running text, not to
       headings, tables, or code, which need to use the full available width. */
    .markdown-section p,
    .markdown-section li,
    .markdown-section blockquote {
      max-width: 75ch;
    }
    .markdown-section p,
    .markdown-section ul,
    .markdown-section ol,
    .markdown-section blockquote {
      margin: 0 0 1.2em;
    }
    .markdown-section li + li {
      margin-top: 0.4em;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h2 span,
    .markdown-section h3,
    .markdown-section h4 {
      max-width: 75ch;
      line-height: 1.35;
    }


    /* Don't rely on color alone to mark a link (WCAG 1.4.1) — but docsify wraps
       every heading's text in its own anchor link (for the #id deep-link), so an
       unscoped rule underlines every title/subtitle too. Exclude those. */
    .markdown-section a {
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .markdown-section h1 a,
    .markdown-section h2 a,
    .markdown-section h3 a,
    .markdown-section h4 a,
    .markdown-section h5 a,
    .markdown-section h6 a {
      text-decoration: none;
    }
    .markdown-section a:focus-visible,
    .sidebar a:focus-visible {
      outline: 2px solid var(--theme-color);
      outline-offset: 2px;
    }

    /* Keep long inline code/URLs from forcing horizontal page scroll on narrow viewports */

    .markdown-section em {
      color: #666666;
    }
    .markdown-section code {
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      color: #005292;
      background-color: #e4f2f8;
    }
    .markdown-section pre code {
      white-space: pre;
    }
    .markdown-section pre {
      overflow-x: auto;
    }
    .markdown-section table {
      display: block;
      overflow-x: auto;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin: 2em 0 0.25em !important;
    }
    .eyebrow + h2 { margin-top: 0.2em; }

    /* Mermaid diagrams don't reflow — scroll them within their own box instead of the page */
    .mermaid-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 1em 0;
    }
    .mermaid-wrap .mermaid {
      display: block;
    }
    .mermaid-wrap svg {
      max-width: 800px;
      height: auto;
      display: block;
    }

    @media screen and (max-width: 480px) {
      .markdown-section {
        /* vue.css's base rule sets max-width: 80%, which caps width below —
           override both so 90% actually takes effect on mobile. */
        width: 90%;
        max-width: 90%;
        margin: 0 auto;
        padding: 16px 0;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Design Systems 101',
      repo: 'https://github.com/F4cu/design-systems-101',
      loadSidebar: true,
      homepage: 'start-here.md',
      subMaxLevel: 2,
      auto2top: true,
      search: {
        depth: 2,
        noData: 'No results.',
        placeholder: 'Search'
      },
      mermaidConfig: {
        theme: 'neutral'
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    // docsify-mermaid@2.0.1 targets mermaid's pre-v10 init API; mermaid 10 is ESM-first
    // and dropped that global surface, so the plugin silently no-ops. Render manually
    // via a docsify lifecycle hook instead, using mermaid 10's current API.
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
      hook.doneEach(function () {
        var blocks = document.querySelectorAll('.markdown-section pre > code.lang-mermaid, .markdown-section pre > code.language-mermaid');
        blocks.forEach(function (code) {
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = code.textContent;
          code.parentElement.replaceWith(div);
        });
        if (blocks.length) mermaid.run({ querySelector: '.mermaid' });
      });
    });
  </script>
</body>
</html>
